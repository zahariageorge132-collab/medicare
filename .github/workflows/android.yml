# Costruisce l'APK di MEDICARE a ogni push su main (e a richiesta).
# L'APK si scarica dalla pagina Actions del repository → apri l'esecuzione → "Artifacts" → medicare-apk.
name: Costruisci APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Versione web + copia dentro il progetto Android
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # Costruisce l'APK di debug (installabile direttamente sul tablet)
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: medicare-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Costruisce l'APK di MEDICARE a ogni push su main (e a richiesta).
# L'APK si scarica dalla pagina Actions del repository → apri l'esecuzione → "Artifacts" → medicare-apk.
name: Costruisci APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Usa l'SDK Android già installato sui runner di GitHub: accetta le licenze
      # e assicura la piattaforma necessaria. Gradle scarica da solo il resto.
      - name: Prepara Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-36" >/dev/null 2>&1 || true

      # Versione web + copia dentro il progetto Android
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # Costruisce l'APK di debug (installabile direttamente sul tablet)
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: medicare-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Pubblica l'APK come Release, con link fisso scaricabile dal tablet:
      # https://github.com/zahariageorge132-collab/medicare/releases/latest/download/MEDICARE.apk
      - name: Prepara file APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MEDICARE.apk
      - name: Pubblica come Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: MEDICARE — ultima versione
          body: "APK di MEDICARE, aggiornato automaticamente a ogni modifica. Scarica MEDICARE.apk e installalo sul tablet."
          files: MEDICARE.apk
